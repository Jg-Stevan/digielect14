# Ola 5 §5.3 (O1) — check diario de FRESCURA del deploy.
#
# Actualizado por A-02 (plan 2026-11-12): GitHub Pages se retiró como canal de
# deploy (borramos deploy-pages.yml y su basePath gemelo) — el canal único es
# Cloudflare Pages (`digielect14.pages.dev`, deploy automático desde
# deploy-cf.yml). Este job ya no COMPARA dos deploys: sondea el único y FALLA
# con mensaje accionable si no responde o si la marca de build no se puede
# extraer. (Abrir un issue automático queda documentado aquí como extensión —
# hoy el fallo rojo del cron es la señal.)
#
# ¿Qué marca se verifica? La VERSION del Service Worker (`const VERSION =
# "e14-<shorthash>"`), que los workflows que construyen derivan del SHA del
# commit en el paso «Derivar versión del SW del build» (6.6) — es el BUILD_ID
# observable desde fuera: mismo commit servido ⇒ misma cadena. Es el
# equivalente servido del `appVersion`/BUILD_ID que nombra el bloque 5.3.
name: Frescura de deploy

on:
  schedule:
    - cron: "0 6 * * *" # diaria 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frescura:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar marca de build servida (Cloudflare Pages)
        run: |
          set -euo pipefail
          CF_URL="https://digielect14.pages.dev/sw.js"

          estado_cf=$(curl -sS -o /tmp/sw-cf.js -w '%{http_code}' "$CF_URL") || estado_cf="sin-respuesta"

          if [ "$estado_cf" != "200" ]; then
            echo "::error::Cloudflare Pages no sirve sw.js (HTTP: $estado_cf) — $CF_URL"
            echo "Accionable: revisa el último run de deploy-cf.yml (¿falta el secreto CF_API_TOKEN o falló el deploy?)."
            exit 1
          fi

          # Misma regex que el sed de «Derivar versión del SW del build»: si
          # este check deja de extraer la cadena, el patrón se desalineó.
          ver_cf=$(sed -n 's/^[[:space:]]*const VERSION = "\(.*\)";.*/\1/p' /tmp/sw-cf.js | head -n1)

          echo "Cloudflare: $ver_cf"

          if [ -z "$ver_cf" ]; then
            echo "::error::No se pudo extraer la VERSION del sw.js servido."
            echo "Accionable: el patrón del sed de «Derivar versión» ya no coincide con public/sw.js — alinear workflow y archivo."
            exit 1
          fi

          echo "OK: Cloudflare Pages sirve la marca de build «$ver_cf»."
