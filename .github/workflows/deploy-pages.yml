name: Deploy to GitHub Pages

# digitalizador-e14 en la raíz: https://jg-stevan.github.io/digielect14/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_STATIC: "1"
      NEXT_PUBLIC_BASE_PATH: /digielect14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        # Misma versión fija que `quality.yml`: este workflow usa
        # `bunx next build` (NO `bun run build`), así que no corre el
        # `prebuild` que regenera capa0-qr.worker.js → lo que se publica son
        # los bytes commiteados. El gate valida exactamente esos mismos bytes.
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Los binarios de public/ no se versionan: este step materializa el
      # vendor de node_modules y baja los modelos/OpenCV con hash fijado. NO
      # recompila el worker (eso lo sigue haciendo el commit), así que la
      # premisa de abajo se mantiene intacta.
      - name: Cache de assets externos
        uses: actions/cache@v4
        with:
          path: |
            public/models/rapidocr/*.onnx
            public/models/tess/*.traineddata.gz
            public/vendor/opencv-4.5.5-core.js
          key: assets-${{ runner.os }}-${{ hashFiles('scripts/assets.lock.json') }}

      - name: Preparar (vendor + assets)
        run: bun run preparar

      # 6.6 (R6) — VERSION del SW y `?v=` del detection-worker derivadas del
      # SHA del commit: mismo paso que quality.yml/deploy-cf.yml para que AMBOS
      # deploys sirvan la misma marca y el check diario de frescura
      # (frescura-deploys.yml) compare lo mismo en los dos lados.
      - name: Derivar versión del SW del build (6.6)
        run: |
          VERSION="e14-$(git rev-parse --short HEAD)"
          sed -i "s/const VERSION = \".*\";/const VERSION = \"$VERSION\";/" public/sw.js
          # NOTA (ajuste verificado sobre el patrón del plan): el cache-busting
          # `?v=` del detection-worker NO vive en public/scanner/detection-worker.js
          # sino en el FUENTE del consumidor (packages/scanner-core/src/core/
          # detector-client.ts, `detection-worker.js?v=8`) — el sed apunta ahí.
          VQ=$(echo "$VERSION" | md5sum | cut -c1-6)
          sed -i "s/?v=[0-9]*/?v=$VQ/g" packages/scanner-core/src/core/detector-client.ts
          echo "VERSION del SW = $VERSION · ?v = $VQ"

      - name: Build estático (raíz del sitio)
        run: bunx next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
