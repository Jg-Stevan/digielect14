# Llamador del workflow de paridad del paquete (ítem 3.8 — mapa v2.3).
# Corre LOS TESTS DEL PAQUETE en el CI de ESTA app con sus assets
# materializados: la garantía de paridad como mecanismo, no promesa.
name: paridad-scanner-core
on:
  push:
    branches: [main]
  pull_request:

# 6.8 (S8) — mínimo privilegio en el llamador.
permissions:
  contents: read

jobs:
  paridad:
    uses: ./.github/workflows/paridad-scanner-core.yml
