# Workflow de paridad reutilizable (ítem 3.8 del mapa v2.3).
#
# Sin esto, la garantía de paridad es promesa, no mecanismo: materializa los
# assets (e14-assets-materializados-v1) y corre LOS TESTS DEL PAQUETE en el CI
# de AMBAS apps. Cada app lo llama desde su propio CI:
#
#   jobs:
#     paridad:
#       uses: Jg-Stevan/<repo-app>/.github/workflows/paridad-scanner-core.yml@main
#       # (copiado en .github/workflows/ de la app — ver cambios/)
#
# El invariante (§6.1): mismo fixture → misma lectura aceptada por la misma
# cascada en ambas apps, aunque el orden de motores configurado difiera.
name: paridad-scanner-core
# 6.8 (S8) — mínimo privilegio también en el workflow REUTILIZABLE.
on:
  workflow_call:
permissions:
  contents: read

jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # 6.14 (O4) — FIJA (era `latest`): era el único workflow de bun sin
          # fijar y el minificador cambia entre versiones — el gate se volvería
          # rojo según el día que corra (misma lección del comentario de
          # quality.yml). Si se sube la versión, alinear TODOS los workflows.
          bun-version: 1.4.2
      - name: "Instalar (workspace: el paquete entra por packages/*)"
        run: bun install --frozen-lockfile || bun install
      - name: Materializar assets del kit (e14-assets-materializados-v1)
        run: bun run preparar
      - name: Tests del PAQUETE (bun:test — corren IGUAL en ambos CIs)
        run: bun test packages/scanner-core
      - name: Build único del worker capa-0 (3.7 — MISMO artefacto en ambas apps)
        run: bun packages/scanner-core/scripts/build-capa0-worker.mjs
      - name: Typecheck del paquete
        run: cd packages/scanner-core && bunx tsc --noEmit
