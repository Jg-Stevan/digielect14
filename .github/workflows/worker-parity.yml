name: Worker parity

# Sustituido por el workflow de paridad del paquete (3.8 —
# paridad-scanner-core.yml), que corre los 120 tests y el build único del
# worker capa-0 en ambos repos. Queda solo manual, como referencia del
# detection-worker del laboratorio.
on: [workflow_dispatch]

# 6.8 (S8) — mínimo privilegio (workflow manual de referencia).
permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL https://raw.githubusercontent.com/Jg-Stevan/web-scanner/main/apps/scanner-lab/public/scanner/detection-worker.js -o /tmp/worker-lab.js
          diff -q /tmp/worker-lab.js public/scanner/detection-worker.js
