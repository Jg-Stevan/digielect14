name: Quality Gate

# Gate en PR y push a main: tipos + lint + build estático (consumo real de
# @jg-stevan/scanner-core desde npm).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build estático (sanity)
        run: bunx next build
        env:
          BUILD_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /digielect14
